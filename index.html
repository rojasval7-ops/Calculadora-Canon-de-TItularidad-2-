const fmt = n => Math.round(n).toLocaleString("es-ES", { useGrouping: true }) + " €";
const getBocas = p => [...new Set(DB[p].map(r => r.boca))].sort((a,b) => a-b);
const getFilas = (p,b) => [...new Set(DB[p].filter(r => r.boca===+b).map(r => r.fila))].sort((a,b) => a-b);
const getRow   = (p,b,f) => DB[p].find(r => r.boca===+b && r.fila===+f);

const calcData = (prod, yrs, boca, fila, qty, numPay) => {
  const row = getRow(prod, boca, fila);
  if (!row) return null;
  const q      = qty;
  const isOne  = numPay === 1;
  const ofUnit = isOne
    ? (yrs === "15" ? row.of15y : row.of30y1shot)
    : (yrs === "15" ? row.of15y : row.of30y);
  const totalOF     = Math.round(ofUnit * MULT[numPay]) * q;
  const dueNow      = isOne ? totalOF : Math.round(totalOF * 0.25);
  const pendingPays = isOne ? 0 : numPay - 1;
  const payAmt      = pendingPays > 0 ? Math.round((totalOF - dueNow) / pendingPays) : 0;
  const seatTotal   = row.seatPrice * q;
  return {
    totalOF, dueNow, pendingPays, payAmt, seatTotal,
    grand: totalOF + seatTotal,
    avgAnnual: Math.round(totalOF / parseInt(yrs)),
    seatPrice: row.seatPrice,
    avail: row.numeros.length,
  };
};

      border:`1px solid ${dark ? "rgba(201,168,60,0.28)" : C.sep}` }}>

      {/* header */}
      <div style={{ padding:"12px 16px", fontSize:11, letterSpacing:"2.5px",
        textTransform:"uppercase", fontWeight:600, background:hbg,
        color: C.yellow,
        borderBottom:`1px solid rgba(255,255,255,0.12)`,
        display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <span>{title}</span>
        <button onClick={onClear}
          style={{ background:"rgba(163,35,75,0.25)",
            border:`1px solid rgba(163,35,75,0.5)`,
            color: C.yellow, fontFamily:"inherit", fontSize:9, letterSpacing:"1.5px",
            textTransform:"uppercase", cursor:"pointer", padding:"3px 9px", borderRadius:4 }}>
          {t.reset}
        </button>
      </div>

      {/* selectors */}
      <div style={{ padding:"13px 16px 11px", display:"flex", flexDirection:"column", gap:9,
        background:sbg, borderBottom:`1px solid rgba(255,255,255,0.10)` }}>
        <Sel label={t.product} dark={dark} isEmpty={isEmpty} value={prod} onChange={upd("prod")}
          options={["Pitch Row","Balcony","Player Zone","VRS"].map(v => ({ v, l: t.products[v] }))} />
        <Sel label={t.years} dark={dark} isEmpty={isEmpty} value={yrs} onChange={upd("yrs")}
          options={[{v:"15",l:t.yrs15},{v:"30",l:t.yrs30}]} />
        <Sel label={t.boca} dark={dark} isEmpty={isEmpty} value={boca} onChange={upd("boca")}
          options={bocas.map(b => ({v:b, l:b}))} />
        <Sel label={t.fila} dark={dark} isEmpty={isEmpty} value={fila} onChange={upd("fila")}
          options={filas.map(f => ({v:f, l:f}))} />
        <Sel label={t.seats} dark={dark} isEmpty={isEmpty} value={qty} onChange={upd("qty", Number)}
          options={seatOptions.map(n => ({v:n, l:n}))} />
        <Sel label={t.payments} dark={dark} isEmpty={isEmpty} value={numPay} onChange={upd("numPay", Number)}
          options={[{v:1,l:t.pay1},{v:4,l:t.pay4},{v:6,l:t.pay6}]} />
      </div>

      {/* availability */}
      <div style={{ padding:"5px 16px 6px", fontSize:11, minHeight:22,
        color:"rgba(245,197,24,0.85)" }}>
        {data ? t.seatsAvail(data.avail) : ""}
      </div>

      {/* OF */}
      <Sec label={t.ownershipFee} value={data ? fmt(data.totalOF) : "—"} big dark={dark} />
      <Row label={t.ofDueNow} value={data ? fmt(data.dueNow) : "—"} dark={dark} />
      {data && data.pendingPays > 0 && <PayRow label={t.payEachSeason} n={data.pendingPays} amt={fmt(data.payAmt)} dark={dark} />}

      {/* Hospitality */}
      <Sec label={t.vipHospitality} value={data ? fmt(data.seatTotal) : "—"} big dark={dark} />

      {/* grand total */}
      <div style={{ display:"flex", alignItems:"baseline", padding:"16px 16px",
        borderTop:`2px solid rgba(245,197,24,0.4)`, background:"rgba(245,197,24,0.06)" }}>
        <span style={{ fontSize:10, letterSpacing:"2px", textTransform:"uppercase", fontWeight:600,
          color:"rgba(255,255,255,0.65)", width:156, flexShrink:0 }}>
          {t.totalOf}
        </span>
        <span style={{ fontFamily:"'FCBarcelonaSerif', Georgia, serif", fontStyle:"italic", fontSize:32, fontWeight:700,
          color: C.yellow, flex:1, textAlign:"right",
          textShadow:"0 0 16px rgba(245,197,24,0.35)" }}>
          {data ? fmt(data.grand) : "—"}
        </span>
      </div>

      {/* footer rows */}
      <div style={{ background:fbg, borderTop:`1px solid ${bd}` }}>
        {[
          { k: t.avgAnnual,    v: data ? fmt(data.avgAnnual) : "—", green:false },
          { k: t.pricePerSeat, v: data ? fmt(data.seatPrice) : "—", green:false },
          ...(showSaving && savingAmt ? [{ k: t.saving, v: savingAmt, green:true }] : []),
        ].map(({ k, v, green }) => (
          <div key={k} style={{ display:"flex", alignItems:"baseline", padding:"8px 16px",
            borderBottom:`1px solid ${bd}` }}>
            <span style={{ fontSize:12, fontWeight:300, width:160, flexShrink:0,
              color: dark ? "rgba(255,255,255,0.38)" : C.ink4 }}>{k}</span>
            <span style={{ fontFamily:"'FCBarcelonaSerif', Georgia, serif", fontSize:16, fontWeight:700,
              textAlign:"right", flex:1,
              color: green ? (dark ? "#5bcf80" : "#2a7a4a") : (dark ? C.gold3 : C.gold) }}>
              {v}
            </span>
          </div>
        ))}
        {prod === "VRS" && !isEmpty && (
          <div style={{ padding:"10px 16px", fontFamily:"'FCBarcelonaSerif', sans-serif", fontSize:11,
            lineHeight:1.4, letterSpacing:".2px",
            color: dark ? C.gold3 : C.gold,
            background: dark ? "rgba(201,168,60,0.08)" : C.goldBg,
            borderTop:`1px solid ${dark ? "rgba(201,168,60,0.2)" : "rgba(138,110,30,0.2)"}` }}>
            ⚠ <strong>{t.vrsWarning}</strong>
          </div>
        )}
      </div>
    </div>
  );
}

              color:"rgba(255,255,255,0.55)", marginTop:5, textTransform:"uppercase" }}>
              {t.subtitle}
            </div>
          </div>

          {/* RIGHT: language selector */}
          <select value={lang} onChange={e => setLang(e.target.value)}
            style={{ background:"transparent", border:`1px solid ${C.yellow}`,
              borderRadius:6, color:C.yellow, fontFamily:"'FCBarcelonaSerif', Georgia, serif",
              fontSize:12, fontWeight:600, letterSpacing:"1px",
              padding:"7px 32px 7px 12px", cursor:"pointer",
              appearance:"none", WebkitAppearance:"none",
              backgroundImage:arrow(C.yellow),
              backgroundRepeat:"no-repeat", backgroundPosition:"right 10px center",
              outline:"none", flexShrink:0 }}>
            <option value="en" style={{ background:"#1a2238" }}>English</option>
            <option value="es" style={{ background:"#1a2238" }}>Español</option>
            <option value="ca" style={{ background:"#1a2238" }}>Català</option>
          </select>
        </div>
      </div>

      {/* ── PANELS BOX ── */}
      <div style={{ maxWidth:940, margin:"0 auto", background:"#1a2238", borderRadius:14,
        border:`1px solid rgba(255,255,255,0.10)`, padding:24,
        boxShadow:"0 8px 48px rgba(0,0,0,0.4)" }}>

        {/* ── two panels ── */}
        <div style={{ display:"flex", gap:32, alignItems:"flex-start" }}>
          <Panel dark={false} title={t.selectTerm} isB={false}
            state={a || initA} isEmpty={!a} onClear={() => setA(null)} setState={v => setA(v)}
            showSaving={cheaperIs === "a"} savingAmt={savingAmt} t={t} />
          <Panel dark={true}  title={t.compareTo}  isB={true}
            state={b || initB0} isEmpty={!b} onClear={() => setB(null)} setState={v => setB(v)}
            showSaving={cheaperIs === "b"} savingAmt={savingAmt} t={t} />
        </div>

        <div style={{ marginTop:13, fontFamily:"'FCBarcelonaSerif', Georgia, serif", fontSize:11,
          color:"rgba(255,255,255,0.40)", textAlign:"center", letterSpacing:".5px" }}>
          {t.vat}
        </div>
      </div>
    </div>
  );
}




const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
